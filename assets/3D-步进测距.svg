<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>

  <!-- 墙 -->
  <rect x="540" y="30" width="22" height="170" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <text x="551" y="222" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">墙</text>

  <!-- player -->
  <polygon points="60,98 60,142 102,120" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
  <text x="78" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">player</text>

  <!-- 光线：冲过头 -->
  <line x1="98" y1="120" x2="606" y2="120" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrO)"/>

  <!-- 大步步进箭头 -->
  <path d="M 200,108 l 12,12 l -12,12" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <path d="M 300,108 l 12,12 l -12,12" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <path d="M 400,108 l 12,12 l -12,12" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <text x="300" y="88" text-anchor="middle" font-size="14" fill="#b45309">大步冲 2px（原来是 4）</text>

  <!-- 过冲标记 -->
  <circle cx="585" cy="120" r="10" fill="none" stroke="#dc2626" stroke-width="2"/>
  <line x1="578" y1="113" x2="592" y2="127" stroke="#dc2626" stroke-width="2"/>
  <line x1="592" y1="113" x2="578" y2="127" stroke="#dc2626" stroke-width="2"/>
  <text x="585" y="95" text-anchor="middle" font-size="13" fill="#dc2626">过冲 ≤2px</text>

  <!-- 小步退 -->
  <line x1="606" y1="160" x2="560" y2="160" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>
  <text x="455" y="185" text-anchor="middle" font-size="14" fill="#1e40af">小步退 −0.5（原来是 1）→ 停在墙沿</text>
</svg>
