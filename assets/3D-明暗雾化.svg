<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>

  <!-- 三面同样高的墙，亮度随距离衰减 -->
  <rect x="120" y="70" width="80" height="120" rx="2" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
  <rect x="300" y="70" width="80" height="120" rx="2" fill="#64748b" stroke="#475569" stroke-width="2"/>
  <rect x="480" y="70" width="80" height="120" rx="2" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>

  <text x="160" y="50" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">近 · 亮</text>
  <text x="520" y="50" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">远 · 暗</text>

  <line x1="210" y1="130" x2="292" y2="130" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrG)"/>
  <line x1="390" y1="130" x2="472" y2="130" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrG)"/>
  <text x="340" y="115" text-anchor="middle" font-size="13" fill="#64748b">distance ↑</text>

  <text x="160" y="218" text-anchor="middle" font-size="14" fill="#334155">d = 20 → 亮度 107</text>
  <text x="340" y="218" text-anchor="middle" font-size="14" fill="#334155">d = 60 → 亮度 80</text>
  <text x="520" y="218" text-anchor="middle" font-size="14" fill="#334155">d = 100 → 亮度 53</text>

  <text x="340" y="250" text-anchor="middle" font-size="15" fill="#334155">笔的亮度 = 120 − distance ÷ 1.5</text>
</svg>
