<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>

  <!-- 视角扇形着色 -->
  <polygon points="105,235 245,48 580,120 328,292" fill="#eff6ff" opacity="0.65"/>

  <!-- 近处的墙（上，被最左端视线击中） -->
  <rect x="240" y="20" width="95" height="50" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <text x="287" y="90" text-anchor="middle" font-size="14" fill="#334155">近处的墙</text>

  <!-- 远处的墙（右） -->
  <rect x="575" y="40" width="22" height="250" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <text x="586" y="312" text-anchor="middle" font-size="14" fill="#334155">远处的墙</text>

  <!-- 近处的墙（下） -->
  <rect x="320" y="282" width="90" height="38" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="2"/>

  <!-- player -->
  <polygon points="88,213 88,257 130,235" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
  <text x="105" y="283" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">player</text>

  <!-- 视线：最左端（红，加粗） -->
  <line x1="105" y1="235" x2="245" y2="48" stroke="#dc2626" stroke-width="3" marker-end="url(#arrR)"/>
  <text x="152" y="58" text-anchor="end" font-size="15" font-weight="bold" fill="#dc2626">视角最左端</text>

  <!-- 中间与下方视线 -->
  <line x1="105" y1="235" x2="576" y2="120" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrO)"/>
  <line x1="105" y1="235" x2="322" y2="288" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrO)"/>

  <text x="255" y="205" font-size="15" font-style="italic" fill="#64748b">视角（FOV）</text>
</svg>
