<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <!-- 480px 舞台宽标尺 -->
  <line x1="80" y1="36" x2="560" y2="36" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="80" y1="30" x2="80" y2="42" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="560" y1="30" x2="560" y2="42" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#64748b">480px 舞台宽度</text>

  <!-- RES = 4 : 24 格 -->
  <rect x="80" y="55" width="480" height="18" fill="#eff6ff" stroke="#475569" stroke-width="1.5"/>
  <path d="M100,55 V73 M120,55 V73 M140,55 V73 M160,55 V73 M180,55 V73 M200,55 V73 M220,55 V73 M240,55 V73 M260,55 V73 M280,55 V73 M300,55 V73 M320,55 V73 M340,55 V73 M360,55 V73 M380,55 V73 M400,55 V73 M420,55 V73 M440,55 V73 M460,55 V73 M480,55 V73 M500,55 V73 M520,55 V73 M540,55 V73" stroke="#94a3b8" stroke-width="1"/>
  <text x="70" y="69" text-anchor="end" font-size="14" fill="#334155">RES = 4</text>
  <text x="572" y="69" font-size="14" fill="#334155">120 列</text>

  <!-- RES = 8 : 12 格（工程默认，首列高亮） -->
  <rect x="80" y="140" width="40" height="24" fill="#fde68a" stroke="#475569" stroke-width="1.5"/>
  <rect x="120" y="140" width="440" height="24" fill="#eff6ff" stroke="#475569" stroke-width="1.5"/>
  <path d="M160,140 V164 M200,140 V164 M240,140 V164 M280,140 V164 M320,140 V164 M360,140 V164 M400,140 V164 M440,140 V164 M480,140 V164 M520,140 V164" stroke="#94a3b8" stroke-width="1"/>
  <text x="70" y="157" text-anchor="end" font-size="14" font-weight="bold" fill="#334155">RES = 8</text>
  <text x="572" y="157" font-size="14" font-weight="bold" fill="#334155">60 列（工程默认）</text>
  <text x="100" y="184" text-anchor="middle" font-size="12" fill="#b45309">首列中心 X = RES/2 − 240 = −236</text>

  <!-- RES = 16 : 6 格 -->
  <rect x="80" y="230" width="480" height="30" fill="#eff6ff" stroke="#475569" stroke-width="1.5"/>
  <path d="M160,230 V260 M240,230 V260 M320,230 V260 M400,230 V260 M480,230 V260" stroke="#94a3b8" stroke-width="1"/>
  <text x="70" y="250" text-anchor="end" font-size="14" fill="#334155">RES = 16</text>
  <text x="572" y="250" font-size="14" fill="#334155">30 列</text>

  <text x="320" y="308" text-anchor="middle" font-size="15" fill="#334155">scan line = 480 ÷ RES —— 画几根线，即画面细腻度</text>
</svg>
