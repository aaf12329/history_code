<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>YOLO智能检测系统登陆界面</title>
    <script src="/static/js/vue.js"></script>
    <script src="/static/js/jquery-3.1.1.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('/static/image/image_2.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        /* 磨砂玻璃卡片 — 只在卡片区域模糊，四周背景高清 */
        .glass-card {
            background: rgba(20, 20, 30, 0.5);
            backdrop-filter: blur(14px);
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 100%;
            max-width: 480px;
            padding: 44px 38px 48px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
            position: relative;
            z-index: 2;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 42px;
        }

        .logo-area h1 {
            font-size: 2.6rem;
            font-weight: 600;
            letter-spacing: 6px;
            color: #ffffff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            font-family: 'Segoe UI', system-ui;
        }

        .logo-area p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.7rem;
            letter-spacing: 2px;
            margin-top: 10px;
            text-transform: uppercase;
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            display: inline-block;
            padding-top: 12px;
        }

        .input-group {
            margin-bottom: 28px;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .input-field {
            width: 100%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 32px;
            padding: 14px 20px;
            font-size: 0.95rem;
            color: #f5f5f5;
            font-family: monospace;
            transition: all 0.2s;
            outline: none;
        }

        .input-field:focus {
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
        }

        .action-group {
            display: flex;
            gap: 18px;
            margin-top: 36px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 13px 0;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: 0.2s ease;
            text-align: center;
            border: none;
            font-family: inherit;
            background: transparent;
        }

        .btn-outline {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #eeeeee;
        }

        .btn-outline:hover {
            border-color: #ffffff;
            color: #ffffff;
            background: rgba(20, 20, 20, 0.7);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: rgba(255, 255, 255, 0.85);
            color: #000000;
            border: 1px solid #ffffff;
            backdrop-filter: blur(2px);
        }

        .btn-primary:hover {
            background: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.2);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 32px 0 12px;
        }

        .line {
            height: 1px;
            background: rgba(255, 255, 255, 0.25);
            flex: 1;
        }

        .footer-info {
            display: flex;
            justify-content: space-between;
            margin-top: 32px;
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 20px;
        }

        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.6) inset !important;
            -webkit-text-fill-color: #fff !important;
        }

        @media (max-width: 500px) {
            .glass-card {
                padding: 32px 24px 36px;
            }
            .logo-area h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div id="app" class="glass-card">
        <div class="logo-area">
            <h1>基于YOLO的智能车牌识别</h1>
            <p>登陆界面</p>
        </div>

        <div class="input-group">
            <label>邮箱</label>
            <input type="text" class="input-field" v-model="email" placeholder="输入你的邮箱" autocomplete="off">
        </div>

        <div class="input-group">
            <label>动态验证码</label>
            <input type="text" class="input-field" v-model="code" placeholder="4 位验证码">
        </div>

        <div class="action-group">
            <button type="button" class="btn btn-outline" @click="sendCode">发送验证码</button>
            <button type="button" class="btn btn-primary" @click="login">登陆</button>
            <button type="button" class="btn btn-primary" @click="register">注册</button>
        </div>

        <div class="divider">
            <div class="line"></div>
            <div class="line"></div>
        </div>

        <div class="footer-info">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <script>
        new Vue({
            el: '#app',
            data: { email: '', code: '' },
            methods: {
                sendCode() {
                    if (!this.email) {
                        alert('请输入邮箱地址');
                        return;
                    }
                    $.ajax
                    ({
                        url: "/sendCode/",
                        data: { email: this.email },
                        success: (res) =>
                        {
                            console.log(res);
                            if (res.code == 500)
                            {
                                alert(res.msg);
                                if(res.msg==="您在黑名单中，无法使用该系统")
                                {
                                    alert(res.msg)
                                }
                                else
                                {
                                    window.location.href = "/static/register.html";
                                }
                            }
                            else
                            {
                                alert('验证码已发送');
                            }
                        },
                        error: () =>
                        {
                            alert('请求失败，请稍后重试');
                        }
                    });
                },
                login()
                {
                    if (!this.code)
                    {
                        alert('请输入验证码');
                        return;
                    }
                    $.ajax
                    ({
                        url: "/login/",
                        data: { code: this.code },
                        success: (res) =>
                        {
                            console.log(res);
                            alert('登录成功');
                            window.location.href = "/static/index.html";
                        },
                        error: () =>
                        {
                            alert('登录失败请检查网络');
                        }
                    });
                },
                register()
                {
                    window.location.href = "/static/register.html";
                }
            }
        });
    </script>
</body>
</html>
