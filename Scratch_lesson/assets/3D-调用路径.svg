<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 640" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>

  <!-- 箭头 -->
  <line x1="230" y1="78"  x2="230" y2="98"  stroke="#475569" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="230" y1="160" x2="230" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="230" y1="242" x2="230" y2="262" stroke="#475569" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="230" y1="324" x2="230" y2="344" stroke="#475569" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="230" y1="406" x2="230" y2="426" stroke="#475569" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="230" y1="488" x2="230" y2="508" stroke="#475569" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- ① player 运动代码 -->
  <rect x="65" y="20" width="330" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="230" y="43" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">player 运动代码</text>
  <text x="230" y="64" text-anchor="middle" font-size="13" fill="#334155">内含 📡 广播 RayCast（跨角色调用）</text>

  <!-- ② 碰撞箱接收广播 -->
  <rect x="65" y="102" width="330" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="230" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">碰撞箱（level）接收广播</text>
  <text x="230" y="146" text-anchor="middle" font-size="13" fill="#334155">触发渲染</text>

  <!-- ③ 清空屏幕 -->
  <rect x="65" y="184" width="330" height="56" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="230" y="207" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2933">清空屏幕</text>
  <text x="230" y="228" text-anchor="middle" font-size="13" fill="#334155">清理上一次的画面</text>

  <!-- ④ 朝向 player -->
  <rect x="65" y="266" width="330" height="56" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="230" y="289" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a3412">RayCaster 朝向 player</text>
  <text x="230" y="310" text-anchor="middle" font-size="13" fill="#334155">转向玩家位置 ▷</text>

  <!-- ⑤ 对准最左端 -->
  <rect x="65" y="348" width="330" height="56" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="230" y="371" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a3412">对准视野最左端</text>
  <text x="230" y="392" text-anchor="middle" font-size="13" fill="#334155">初始线 · 左转 FOV/2</text>

  <!-- ⑥ 循环画线 -->
  <rect x="65" y="430" width="330" height="56" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="230" y="453" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a3412">Singal Ray 画一列竖线</text>
  <text x="230" y="474" text-anchor="middle" font-size="13" fill="#334155">右转 1° → 再调用（循环）</text>

  <!-- ⑦ 一帧完成 -->
  <rect x="65" y="512" width="330" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="230" y="535" text-anchor="middle" font-size="16" font-weight="bold" fill="#065f46">直到最右端</text>
  <text x="230" y="556" text-anchor="middle" font-size="13" fill="#334155">一帧画完 ✅</text>
</svg>
