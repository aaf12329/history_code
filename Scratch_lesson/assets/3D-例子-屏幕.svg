<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>

  <!-- 地面 -->
  <line x1="40" y1="285" x2="640" y2="285" stroke="#475569" stroke-width="2"/>

  <!-- 左侧近墙（高） -->
  <rect x="70" y="40" width="110" height="245" rx="2" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="82"  y1="50" x2="82"  y2="275" stroke="#64748b" stroke-width="2"/>
  <line x1="94"  y1="50" x2="94"  y2="275" stroke="#64748b" stroke-width="2"/>
  <line x1="106" y1="50" x2="106" y2="275" stroke="#64748b" stroke-width="2"/>
  <line x1="118" y1="50" x2="118" y2="275" stroke="#64748b" stroke-width="2"/>
  <line x1="130" y1="50" x2="130" y2="275" stroke="#64748b" stroke-width="2"/>
  <line x1="142" y1="50" x2="142" y2="275" stroke="#64748b" stroke-width="2"/>
  <line x1="154" y1="50" x2="154" y2="275" stroke="#64748b" stroke-width="2"/>
  <line x1="166" y1="50" x2="166" y2="275" stroke="#64748b" stroke-width="2"/>

  <!-- 中间远墙（矮） -->
  <rect x="290" y="150" width="100" height="135" rx="2" fill="none" stroke="#dc2626" stroke-width="2" opacity="0.75"/>
  <line x1="302" y1="160" x2="302" y2="275" stroke="#94a3b8" stroke-width="2"/>
  <line x1="316" y1="160" x2="316" y2="275" stroke="#94a3b8" stroke-width="2"/>
  <line x1="330" y1="160" x2="330" y2="275" stroke="#94a3b8" stroke-width="2"/>
  <line x1="344" y1="160" x2="344" y2="275" stroke="#94a3b8" stroke-width="2"/>
  <line x1="358" y1="160" x2="358" y2="275" stroke="#94a3b8" stroke-width="2"/>
  <line x1="372" y1="160" x2="372" y2="275" stroke="#94a3b8" stroke-width="2"/>

  <!-- 右侧近墙（高） -->
  <rect x="500" y="40" width="110" height="245" rx="2" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="512" y1="50" x2="512" y2="275" stroke="#64748b" stroke-width="2"/>
  <line x1="524" y1="50" x2="524" y2="275" stroke="#64748b" stroke-width="2"/>
  <line x1="536" y1="50" x2="536" y2="275" stroke="#64748b" stroke-width="2"/>
  <line x1="548" y1="50" x2="548" y2="275" stroke="#64748b" stroke-width="2"/>
  <line x1="560" y1="50" x2="560" y2="275" stroke="#64748b" stroke-width="2"/>
  <line x1="572" y1="50" x2="572" y2="275" stroke="#64748b" stroke-width="2"/>
  <line x1="584" y1="50" x2="584" y2="275" stroke="#64748b" stroke-width="2"/>
  <line x1="596" y1="50" x2="596" y2="275" stroke="#64748b" stroke-width="2"/>

  <!-- 标注 -->
  <text x="70" y="24" font-size="15" font-weight="bold" fill="#dc2626">屏幕最左端</text>
  <line x1="103" y1="28" x2="118" y2="40" stroke="#dc2626" stroke-width="2" marker-end="url(#arrR)"/>

  <text x="125" y="315" text-anchor="middle" font-size="15" fill="#334155">近墙 · 画得高</text>
  <text x="340" y="315" text-anchor="middle" font-size="15" fill="#334155">远处的墙 · 画得矮</text>
  <text x="555" y="315" text-anchor="middle" font-size="15" fill="#334155">近墙 · 画得高</text>
</svg>
