<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
  </defs>

  <!-- 墙 -->
  <rect x="70" y="50" width="540" height="16" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
  <text x="340" y="38" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">墙</text>

  <!-- player -->
  <polygon points="318,260 318,304 360,282" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
  <text x="336" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">player</text>

  <!-- 垂直于墙的光线（正中，最短） -->
  <line x1="332" y1="280" x2="332" y2="72" stroke="#2563eb" stroke-width="3" marker-end="url(#arrB)"/>
  <text x="348" y="170" font-size="14" fill="#1e40af">垂面距离（最短）</text>

  <!-- 斜射光线 -->
  <line x1="330" y1="282" x2="152" y2="72" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrO)"/>
  <line x1="330" y1="282" x2="508" y2="72" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrO)"/>
  <text x="185" y="150" font-size="14" fill="#b45309">斜着走，distance 更长</text>

  <!-- 偏角弧 -->
  <path d="M 338,218 A 64,64 0 0 1 382,228" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text x="395" y="238" font-size="14" fill="#334155">偏角 θ = 方向 − dir</text>

  <!-- 公式框 -->
  <rect x="395" y="255" width="265" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="527" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">墙 → 玩家平面的距离</text>
  <text x="527" y="302" text-anchor="middle" font-size="14" fill="#1e3a8a">= distance × cos θ（反过来一样）</text>
</svg>
