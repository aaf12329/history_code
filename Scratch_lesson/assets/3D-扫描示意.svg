<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>

  <!-- 墙 -->
  <rect x="560" y="30" width="24" height="245" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <text x="572" y="296" text-anchor="middle" font-size="18" font-weight="bold" fill="#334155">墙</text>

  <!-- player -->
  <polygon points="70,128 70,172 112,150" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
  <text x="88" y="202" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">player</text>

  <!-- 初始线（最左端） -->
  <line x1="108" y1="150" x2="552" y2="74" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrR)"/>
  <text x="205" y="70" font-size="15" font-weight="bold" fill="#dc2626">初始线（视野最左端）</text>

  <!-- 中间虚线（已画完的光线） -->
  <line x1="108" y1="150" x2="552" y2="106" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrG)"/>
  <line x1="108" y1="150" x2="552" y2="150" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrG)"/>
  <line x1="108" y1="150" x2="552" y2="192" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrG)"/>

  <!-- 最右端 -->
  <line x1="108" y1="150" x2="552" y2="228" stroke="#2563eb" stroke-width="3" marker-end="url(#arrB)"/>
  <text x="440" y="252" font-size="15" font-weight="bold" fill="#2563eb">最右端</text>

  <!-- FOV 与旋转标注 -->
  <text x="168" y="185" font-size="15" font-style="italic" fill="#64748b">FOV</text>
  <path d="M 190,93 A 100,100 0 0 1 190,207" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="250" y="155" font-size="14" fill="#334155">每画一列，右转 1°</text>
  <text x="250" y="175" font-size="14" fill="#334155">一帧 = 60 列（FOV 60° ÷ 1°）</text>
</svg>
